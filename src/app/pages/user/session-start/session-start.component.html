<div class="overlay" *ngIf="visible" (click)="onOverlayClick($event)">
  <div class="panel" #panel>

    <!-- Bouton fermer -->
    <button class="close-btn" (click)="close()" aria-label="Fermer">
      <mat-icon>close</mat-icon>
    </button>

    <!-- Zone vidéo -->
    <div class="video-wrapper">
      @if (session?.sport_session_video_url) {
        <video
          #videoRef
          class="session-video"
          [src]="session.sport_session_video_url"
          preload="metadata"
          playsinline
          (click)="toggleVideo()"
        ></video>
        <button class="play-btn" (click)="toggleVideo()" [class.playing]="isPlaying">
          <mat-icon>{{ isPlaying ? 'pause' : 'play_arrow' }}</mat-icon>
        </button>
      } @else {
        <!-- Placeholder si pas de vidéo -->
        <div class="video-placeholder">
          <mat-icon class="placeholder-icon">videocam_off</mat-icon>
          <span>Aucune vidéo disponible</span>
        </div>
      }
    </div>

    <!-- Infos séance -->
    <div class="session-info">
      <p class="session-label">{{ session?.sport_session_name }}</p>

      @if (session?.sport_session_duration) {
        <div class="duration-row">
          <mat-icon class="duration-icon">timer</mat-icon>
          <span class="duration-value">{{ session.sport_session_duration }} min</span>
          <span class="duration-hint">(Minuteur)</span>
        </div>
        <p class="session-desc">{{ session?.sport_session_description }}</p>
      }
    </div>

    <!-- CTA -->
    <div class="cta-area">
      <button class="start-cta" (click)="confirmStart()">
        C'est parti
      </button>
    </div>

  </div>
</div>
