<div class="page">

  <!-- Bouton retour -->
  <button class="back-btn" (click)="goBack()">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <!-- Zone vidéo -->
  <div class="video-wrapper">
    @if (session?.sport_session_video_url) {
      <video
        #videoRef
        class="session-video"
        [src]="session.sport_session_video_url"
        preload="metadata"
        playsinline
        (click)="toggleVideo()"
      ></video>
      <button class="play-btn" (click)="toggleVideo()" [class.playing]="isPlaying">
        <mat-icon>{{ isPlaying ? 'pause' : 'play_arrow' }}</mat-icon>
      </button>
    } @else {
      <div class="video-placeholder">
        <div class="play-circle">
          <mat-icon>play_arrow</mat-icon>
        </div>
        <span>Video</span>
      </div>
    }
  </div>

  <!-- Infos -->
  <div class="info-section">
    <p class="session-desc">{{ session?.sport_session_name }}</p>

    <div class="duration-row">
      <!-- Durée fixe de la séance (si renseignée) -->
      @if (session?.sport_session_duration) {
        <mat-icon class="timer-icon">timer</mat-icon>
        <span class="duration-value">{{ session.sport_session_duration }} min</span>
        <span class="duration-hint">(durée estimée)</span>
      }

      <!-- Durée calculée depuis les exercices -->
      @if (totalDuration != null) {
        <div class="total-duration-badge">
          <mat-icon class="timer-icon">fitness_center</mat-icon>
          <span class="duration-value">{{ totalDuration }} min</span>
          <span class="duration-hint">(total exercices)</span>
        </div>
      }
    </div>
  </div>

  <!-- CTA -->
  <div class="cta-area">
    <button class="start-cta" (click)="confirmStart()">C'est parti</button>
  </div>

</div>
